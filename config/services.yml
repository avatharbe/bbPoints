imports:
  - { resource: 'tables.yml' }
services:
  avathar.bbpoints.listener:
    class: 'avathar\bbpoints\event\listener'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@user'
      - '@template'
      - '@dbal.conn'
      - '@config'
      - '@auth'
      - '@controller.helper'
      - '@cache'
      - '@request'
      - '%core.root_path%'
      - '%core.php_ext%'
      - '%avathar.bbpoints.table.points.bank%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'
      # Phase D — bbAccounts read switchover. Nullable: present only when
      # bbAccounts is installed. The listener auto-detects (mapped + backfilled)
      # and falls back to the legacy column otherwise. Uses the ledger
      # service (not balance_summary) because the navbar/profile reads need
      # wallet-only balances, not per-currency pool aggregates.
      - '@avathar.bbaccounts.service.ledger'
    tags:
      - { name: 'event.listener' }

  avathar.bbpoints.controller:
    class: 'avathar\bbpoints\controller\main'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@avathar.bbpoints.core.points.main'
      - '@avathar.bbpoints.core.points.info'
      - '@avathar.bbpoints.core.points.transfer.user'
      - '@avathar.bbpoints.core.points.bank'
      - '@avathar.bbpoints.core.points.logs'
      - '@avathar.bbpoints.core.points.bank.edit'
      - '@avathar.bbpoints.core.points.lottery'
      - '@avathar.bbpoints.core.points.points.edit'
      - '@avathar.bbpoints.core.points.robbery'
      - '@avathar.bbpoints.core.points.robbery.user'
      - '@avathar.bbpoints.core.points.transfer'
      - '@template'
      - '@user'
      - '@auth'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@controller.helper'
      - '%core.root_path%'
      - '%core.php_ext%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.list.controller:
    class: 'avathar\bbpoints\controller\userlist'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@pagination'
      - '@controller.helper'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.admin.controller:
    class: 'avathar\bbpoints\controller\admin_controller'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@template'
      - '@user'
      - '@auth'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@log'
      - '@service_container'
      - '%core.root_path%'
      - '%core.php_ext%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'
      - '%avathar.bbpoints.table.points.log%'
      - '%avathar.bbpoints.table.points.lottery.history%'

  avathar.bbpoints.notification.type.points:
    class: 'avathar\bbpoints\notification\points'
    shared: false # service MUST not be shared for this to work!
    parent: notification.type.base
    calls:
      - [ set_user_loader, [ '@user_loader' ] ]
      - [ set_helper, [ '@controller.helper' ] ]
    tags:
      - { name: notification.type }

  avathar.bbpoints.core.functions.points:
    class: 'avathar\bbpoints\core\functions_points'
    arguments:
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@controller.helper'
      - '@notification_manager'
      - '@log'
      - '@cache'
      - '@request'
      - '@config'
      - '@ext.manager'
      - '@service_container'
      - '%core.php_ext%'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.bank%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.lottery.history%'
      - '%avathar.bbpoints.table.points.lottery.tickets%'
      - '%avathar.bbpoints.table.points.values%'
      # bbAccounts ledger (Phase B-1 wiring; consumed in B-2). Nullable —
      # UltimatePoints loads and runs normally when bbAccounts is absent.
      - '@avathar.bbaccounts.service.ledger'

  avathar.bbpoints.core.points.main:
    class: 'avathar\bbpoints\core\points_main'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@config'
      - '@controller.helper'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.bank%'
      - '%avathar.bbpoints.table.points.values%'
      - '%avathar.bbpoints.table.points.log%'
      - '%avathar.bbpoints.table.points.lottery.tickets%'
      - '%avathar.bbpoints.table.points.lottery.history%'

  avathar.bbpoints.core.points.info:
    class: 'avathar\bbpoints\core\points_info'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
      - '@dbal.conn'
      - '@template'
      - '@user'
      - '@config'
      - '@controller.helper'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.core.points.transfer.user:
    class: 'avathar\bbpoints\core\points_transfer_user'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@controller.helper'
      - '@notification_manager'
      - '@service_container'
      - '%core.php_ext%'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.log%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.core.points.bank:
    class: 'avathar\bbpoints\core\points_bank'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@controller.helper'
      - '@log'
      - '@notification_manager'
      - '%core.php_ext%'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.bank%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.core.points.logs:
    class: 'avathar\bbpoints\core\points_logs'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
      - '@template'
      - '@user'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@controller.helper'
      - '@pagination'
      - '%core.php_ext%'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.log%'
      - '%avathar.bbpoints.table.points.values%'

  avathar.bbpoints.core.points.bank.edit:
    class: 'avathar\bbpoints\core\points_bank_edit'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
