      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'
      - '%avathar.bbpoints.table.points.lottery.history%'
      - '%avathar.bbpoints.table.points.lottery.tickets%'

  avathar.bbpoints.core.points.points.edit:
    class: 'avathar\bbpoints\core\points_points_edit'
    arguments:
      - '@avathar.bbpoints.core.functions.points'
      - '@auth'
