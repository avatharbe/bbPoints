      - '@user'
      - '@dbal.conn'
      - '@request'
      - '@config'
      - '@controller.helper'
      - '@notification_manager'
      - '@service_container'
      - '%core.php_ext%'
      - '%core.root_path%'
      - '%avathar.bbpoints.table.points.config%'
      - '%avathar.bbpoints.table.points.values%'
      - '%avathar.bbpoints.table.points.log%'
  avathar.bbpoints.core.points.transfer:
    class: 'avathar\bbpoints\core\points_transfer'
